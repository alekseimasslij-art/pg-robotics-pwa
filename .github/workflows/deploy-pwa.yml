name: Publish mobile demo

on:
  push:
    branches: [main]
    paths:
      - 'PG_Robotics_v0.6_GitHub_Pages_Ready.zip'
      - 'deploy/**'
      - 'release_v08/**'
      - 'release_v09/**'
      - 'release_v010/**'
      - 'release_v011/**'
      - 'release_v012/**'
      - 'release_v013/**'
      - 'release_v014/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Flutter application
        shell: bash
        run: |
          test -f PG_Robotics_v0.6_GitHub_Pages_Ready.zip || { echo "Upload PG_Robotics_v0.6_GitHub_Pages_Ready.zip to the repository root"; exit 1; }
          unzip -oq PG_Robotics_v0.6_GitHub_Pages_Ready.zip
          test -f pubspec.yaml
      - name: Apply updated Flutter screens and demo illustrations
        run: |
          test -f release_v08/overlay.zip
          unzip -oq release_v08/overlay.zip
          test -f assets/images/luckystrike.jpg
      - name: Apply v0.9 game, branding and local editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pg_v09
          base64 -d release_v09/payload.b64 | tar -xJ -C /tmp/pg_v09
          for patch in /tmp/pg_v09/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          cp /tmp/pg_v09/news_sheet.dart lib/news_sheet.dart
          sed -i 's/showTimePicker(context: context,time:/showTimePicker(context: context,initialTime:/' lib/news_sheet.dart
          cp /tmp/pg_v09/editor_demo.dart lib/editor_demo.dart
          mkdir -p assets/branding
          cp /tmp/pg_v09/pg_wordmark.png assets/branding/pg_wordmark.png
          grep -q "google_fonts:" pubspec.yaml
          grep -q "_ammoStacks" lib/mission_game.dart
          grep -q "EditorAccessTile" lib/main.dart
      - name: Apply v0.10 gameplay and news editor patch
        shell: bash
        run: |
          set -euo pipefail
          test -f release_v010/overlay.b64
          base64 -d release_v010/overlay.b64 > /tmp/pg_v010_overlay.zip
          unzip -oq /tmp/pg_v010_overlay.zip
          test -f lib/news_sheet.dart
          test -f lib/mission_game.dart
          grep -q 'image:' pubspec.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v0.11 viewport fixes and official app icons
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release_v011/patch.b64 | gzip -d > /tmp/pg_v011.patch
          git apply --check /tmp/pg_v011.patch
          git apply /tmp/pg_v011.patch
          python3 -m pip install --quiet Pillow
          base64 -d release_v011/logo.b64 > /tmp/pg_official_logo.jpg
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil
          logo=Image.open('/tmp/pg_official_logo.jpg').convert('RGB')
          brand=Path('tools/web_branding')
          for name, size in [('Icon-192.png',192),('Icon-512.png',512),('Icon-maskable-192.png',192),('Icon-maskable-512.png',512),('apple-touch-icon.png',180),('favicon.png',48)]:
              logo.resize((size,size),Image.Resampling.LANCZOS).save(brand/name, format='PNG')
          for icon in Path('tools/ios_branding/AppIcon.appiconset').glob('*.png'):
              size=Image.open(icon).width
              logo.resize((size,size),Image.Resampling.LANCZOS).save(icon, format='PNG')
          Path('assets/branding').mkdir(parents=True,exist_ok=True)
          shutil.copy2('/tmp/pg_official_logo.jpg','assets/branding/pg_official_mark.jpg')
          PY
          grep -q '_fromViewport' lib/mission_game.dart
          grep -q '_restoreDemoEditor' lib/main.dart
          grep -q 'version: 0.11.0' pubspec.yaml
      - name: Apply v0.12 shared newsroom and Web Push
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release_v012/overlay.b64 | tar -xJ -C .
          grep -q 'PGBackend' lib/news_sheet.dart
          grep -q 'pgPushSubscribe' deploy/pg_push_client.js
          grep -q 'version: 0.12.0' pubspec.yaml
      - name: Apply v0.13 brand, photo upload and push onboarding fixes
        shell: bash
        run: |
          set -euo pipefail
          test -f release_v013/overlay.b64
          base64 -d release_v013/overlay.b64 | tar -xJ -C .
          grep -q 'version: 0.13.0' pubspec.yaml
          grep -q 'pgChooseNewsImage' deploy/pg_push_client.js
          grep -q '_offerPushOnboarding' lib/main.dart
          grep -q 'news_image_web.dart' lib/news_sheet.dart
      - name: Verify public PG news service
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 35 -sS \
            -X POST -H 'Content-Type: application/json' \
            -d '{"action":"config"}' \
            'https://kehjximjrdgdqshauyuc.supabase.co/functions/v1/pg-robotics-api' \
            | python3 -c 'import json,sys; j=json.load(sys.stdin); assert len(j["vapidPublic"])>80; print("Web Push VAPID configured")'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter web scaffolding
        run: flutter create --platforms=web --org com.example --project-name pg_robotics_app --no-pub .
      - name: Apply PWA branding
        run: python3 tools/configure_web.py
      - name: Get packages
        run: flutter pub get
      - name: Compile mobile client
        run: flutter build web --release --base-href "/pg-robotics-pwa/"
      - name: Configure offline caching
        run: |
          python3 tools/postbuild_pwa.py
          python3 deploy/publish_install.py
          python3 release_v014/notification_format_fix.py
          test -f build/web/icons/Icon-192-v013.png
          test -f build/web/app.html
          test -f build/web/pg_push_client.js
          printf 'User-agent: *\nDisallow: /\n' > build/web/robots.txt
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
