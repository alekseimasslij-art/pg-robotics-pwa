name: Publish mobile demo

on:
  push:
    branches: [main]
    paths:
      - 'PG_Robotics_v0.6_GitHub_Pages_Ready.zip'
      - 'deploy/**'
      - 'release_v08/**'
      - 'release_v09/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Flutter application
        shell: bash
        run: |
          test -f PG_Robotics_v0.6_GitHub_Pages_Ready.zip || { echo "Upload PG_Robotics_v0.6_GitHub_Pages_Ready.zip to the repository root"; exit 1; }
          unzip -oq PG_Robotics_v0.6_GitHub_Pages_Ready.zip
          test -f pubspec.yaml
      - name: Apply updated Flutter screens and demo illustrations
        run: |
          test -f release_v08/overlay.zip
          unzip -oq release_v08/overlay.zip
          test -f assets/images/luckystrike.jpg
      - name: Apply v0.9 game, branding and local editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pg_v09
          base64 -d release_v09/payload.b64 | tar -xJ -C /tmp/pg_v09
          for patch in /tmp/pg_v09/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          cp /tmp/pg_v09/news_sheet.dart lib/news_sheet.dart
          cp /tmp/pg_v09/editor_demo.dart lib/editor_demo.dart
          mkdir -p assets/branding
          cp /tmp/pg_v09/pg_wordmark.png assets/branding/pg_wordmark.png
          grep -q "google_fonts:" pubspec.yaml
          grep -q "_ammoStacks" lib/mission_game.dart
          grep -q "EditorAccessTile" lib/main.dart
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter web scaffolding
        run: flutter create --platforms=web --org com.example --project-name pg_robotics_app --no-pub .
      - name: Apply PWA branding
        run: python3 tools/configure_web.py
      - name: Get packages
        run: flutter pub get
      - name: Compile mobile client
        run: flutter build web --release --base-href "/pg-robotics-pwa/"
      - name: Configure offline caching
        run: |
          python3 tools/postbuild_pwa.py
          python3 deploy/publish_install.py
          printf 'User-agent: *\nDisallow: /\n' > build/web/robots.txt
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
